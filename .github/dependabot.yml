# Weekly version updates; security updates are enabled in repository settings.
# Minor and patch releases are grouped; major releases remain separate.
version: 2
updates:
- package-ecosystem: maven
  directories:
  - /ionic-2/server/background-geo-server
  - /ionic-2/server/hotel-server
  - /ionic-2/server/login-jwt-server
  - /ionic-2/server/push-sender
  - /ionic-2/server/realty-server
  - /ionic-2/server/review-server
  - /ionic-2/server/weather-server
  - /ionic-3/server/rss-server
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
